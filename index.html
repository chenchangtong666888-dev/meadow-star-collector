<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff6ff">
  <title>草地收集小星星</title>
  <style>
    :root{--ink:#2a4050;--muted:#6d8190;--purple:#7058dc;--grass:#82d49b;--grass2:#9ee1a9;--sun:#ffe087;--paper:#fffefa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:linear-gradient(180deg,#e5f7ff 0%,#f5faff 48%,#edf9eb 100%);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold","Microsoft YaHei",system-ui,sans-serif}
    button{font:inherit;touch-action:manipulation}.shell{width:min(760px,100%);padding:clamp(18px,4vw,32px);background:var(--paper);border:3px solid #fff;border-radius:30px;box-shadow:0 20px 55px #41635b1a;position:relative;overflow:hidden}.sun{position:absolute;right:30px;top:20px;width:45px;height:45px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 8px #ffe08735}.header{display:flex;align-items:center;gap:13px;position:relative;z-index:1}.logo{width:58px;height:58px;border-radius:20px;background:#e8f7d8;display:grid;place-items:center;font-size:34px;box-shadow:inset 0 -4px #cce9b5}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:#5d9d72}h1{font-size:clamp(23px,5vw,32px);margin:2px 0 0}.counter{margin-left:auto;background:#fff5d9;border-radius:16px;padding:9px 13px;text-align:center;min-width:80px}.counter small{display:block;color:var(--muted);font-size:10px;font-weight:900}.counter b{color:#bd8b14;font-size:22px}.instruction{text-align:center;margin:16px 0 12px;color:#5d7180;font-size:15px;font-weight:800;line-height:1.6}.progress{display:flex;justify-content:center;gap:5px;margin-bottom:13px}.star{font-size:22px;color:#dfd7bb;transition:transform .2s,color .2s}.star.on{color:#ffbf33;transform:scale(1.08)}
    .meadow{height:clamp(315px,72vw,430px);min-height:315px;border-radius:24px;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(#bfeeff 0%,#e0f8ff 47%,#9be1aa 47.5%,#79ce91 100%);box-shadow:inset 0 -8px #6ab87f}.meadow:before{content:"";position:absolute;z-index:-1;bottom:33%;left:-8%;width:70%;height:31%;border-radius:50%;background:#a5e8ad}.meadow:after{content:"";position:absolute;z-index:-1;bottom:31%;right:-12%;width:67%;height:38%;border-radius:50%;background:#90d99f}.flower{position:absolute;z-index:0;font-size:22px;pointer-events:none;opacity:.85}.flower.f1{left:7%;bottom:14%}.flower.f2{left:31%;bottom:5%}.flower.f3{right:9%;bottom:12%}.flower.f4{right:34%;bottom:4%}.flower.f5{left:47%;bottom:19%;font-size:18px}
    .creature{position:absolute;z-index:2;width:68px;height:70px;border:0;background:#ffffffc9;border-radius:24px;box-shadow:0 5px 0 #598d6b30;display:grid;place-items:center;font-size:43px;cursor:pointer;transform:translate(-50%,-50%);transition:transform .16s,background .16s,opacity .2s;animation:arrive .34s ease-out}.creature:hover{transform:translate(-50%,-55%) scale(1.06)}.creature:active{transform:translate(-50%,-48%) scale(.95)}.creature:focus-visible,.cloud:focus-visible,.restart:focus-visible{outline:4px solid #ffca43;outline-offset:3px}.creature.leaving{opacity:0;transform:translate(-50%,-95%) scale(.7);pointer-events:none}@keyframes arrive{from{opacity:0;transform:translate(-50%,-40%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    .cloud{position:absolute;z-index:3;width:94px;height:66px;border:0;background:#ffffffd9;border-radius:40px;box-shadow:0 5px 0 #70879b25;font-size:41px;display:grid;place-items:center;cursor:pointer;transform:translate(-50%,-50%);transition:transform 1.45s ease-in,opacity 1.45s ease-in}.cloud.sailing{transform:translate(90px,-150px) rotate(10deg);opacity:0;pointer-events:none}.cloud-note{position:absolute;z-index:3;font-size:12px;font-weight:900;color:#6b7b88;background:#ffffffc9;border-radius:20px;padding:5px 9px;transform:translate(-50%,-50%);pointer-events:none}
    .status{min-height:28px;text-align:center;margin:13px 0 0;font-size:15px;font-weight:900;color:#488d60}.status.neutral{color:#738290}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.note{font-size:12px;color:#84919b;line-height:1.5}.restart{border:0;border-radius:14px;padding:11px 15px;background:#f2efff;color:var(--purple);font-weight:900;cursor:pointer}.finish{display:none;position:absolute;z-index:10;inset:0;background:#fffef5f5;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}.finish.show{display:flex}.fireworks{font-size:clamp(37px,10vw,70px);letter-spacing:7px;animation:celebrate .8s ease-in-out infinite alternate}.finish h2{font-size:clamp(28px,7vw,40px);margin:13px 0 3px;color:#5e9c70}.finish p{color:var(--muted);font-weight:800;line-height:1.7}.finish .restart{margin-top:8px;background:var(--purple);color:white;box-shadow:0 5px 0 #543fb4}@keyframes celebrate{to{transform:translateY(-6px) scale(1.04)}}
    @media(max-width:480px){body{padding:9px}.shell{border-radius:24px;padding:17px 14px}.logo{width:49px;height:49px;border-radius:16px;font-size:29px}.counter{min-width:68px;padding:7px 9px}.meadow{height:clamp(315px,95vw,405px);border-radius:20px}.creature{width:59px;height:61px;font-size:37px;border-radius:21px}.cloud{width:82px;height:59px;font-size:36px}.bottom{align-items:flex-end}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell" aria-label="草地收集小星星游戏">
    <div class="sun" aria-hidden="true"></div>
    <header class="header"><div class="logo" aria-hidden="true">🐰</div><div><div class="eyebrow">A GENTLE MEADOW GAME</div><h1>草地收集小星星</h1></div><div class="counter"><small>我的星星</small><b id="count">0 / 8</b></div></header>
    <p class="instruction">点一点小动物，收集闪亮的星星吧！<br>不赶时间，想慢慢玩多久都可以。</p>
    <div class="progress" id="progress" aria-label="收集进度"></div>
    <section class="meadow" id="meadow" aria-label="小动物们的草地">
      <span class="flower f1" aria-hidden="true">🌼</span><span class="flower f2" aria-hidden="true">🌷</span><span class="flower f3" aria-hidden="true">🌸</span><span class="flower f4" aria-hidden="true">🌼</span><span class="flower f5" aria-hidden="true">🍀</span>
    </section>
    <p class="status neutral" id="status" aria-live="polite">小兔子、小鸡和小猫正在草地上玩耍。</p>
    <div class="bottom"><span class="note">小乌云也可以点，它会飘走，不扣星星哦。<br>没有怪物，也不会有吓人的画面。</span><button class="restart" id="restart">再玩一次 ↻</button></div>
    <section class="finish" id="finish" aria-live="polite"><div class="fireworks" aria-hidden="true">🎆 ✨ 🎇</div><h2>星星收集齐啦！</h2><p>小兔子、小鸡和小猫都来庆祝啦！<br>你可以再玩一轮，也可以休息一下。</p><button class="restart" id="again">再玩一次 ↻</button></section>
  </main>
  <script>
    (()=>{
      const TARGET=8,animals=[['🐰','小兔子'],['🐥','小鸡'],['🐱','小猫']];
      const spots=[[13,31],[34,27],[56,34],[82,29],[21,57],[46,59],[72,55],[91,63],[10,77],[34,80],[59,78],[84,81]];
      const meadow=document.getElementById('meadow'),status=document.getElementById('status');let count=0,active=[],cloudId=0,nextId=0,gameOver=false,cloudCount=0,round=0;
      const pick=a=>a[Math.floor(Math.random()*a.length)];
      function drawProgress(){document.getElementById('count').textContent=`${count} / ${TARGET}`;document.getElementById('progress').innerHTML=Array.from({length:TARGET},(_,i)=>`<span class="star ${i<count?'on':''}" aria-hidden="true">${i<count?'★':'☆'}</span>`).join('');}
      function freeSpot(){const used=active.map(x=>x.spot);const candidates=spots.map((_,i)=>i).filter(i=>!used.includes(i));return candidates.length?pick(candidates):pick(spots.map((_,i)=>i));}
      function spawnAnimal(forcedAnimal=null){if(gameOver)return;const [emoji,name]=forcedAnimal||pick(animals),spot=freeSpot(),id=++nextId;active.push({id,spot});const [x,y]=spots[spot];const button=document.createElement('button');button.className='creature';button.type='button';button.textContent=emoji;button.style.left=x+'%';button.style.top=y+'%';button.setAttribute('aria-label',`收集${name}`);button.addEventListener('click',()=>collect(button,id,name));meadow.append(button);}
      function collect(button,id,name){if(gameOver)return;const thisRound=round;button.classList.add('leaving');button.disabled=true;active=active.filter(x=>x.id!==id);count++;drawProgress();status.textContent=`收集到一颗星星！谢谢${name}来玩。`;status.className='status';setTimeout(()=>button.remove(),230);if(count>=TARGET){gameOver=true;setTimeout(()=>document.getElementById('finish').classList.add('show'),550);return;}setTimeout(()=>{if(thisRound===round)spawnAnimal();},520);if(count===2||count===5){setTimeout(()=>{if(thisRound===round)spawnCloud();},1100);}}
      function spawnCloud(){if(gameOver||cloudId)return;const [x,y]=pick([[73,20],[88,40],[26,20],[54,18]]);cloudId=++nextId;const cloud=document.createElement('button');cloud.id='cloud-'+cloudId;cloud.className='cloud';cloud.type='button';cloud.textContent='☁️';cloud.style.left=x+'%';cloud.style.top=y+'%';cloud.setAttribute('aria-label','小乌云，点一下让它飘走');cloud.addEventListener('click',()=>sendCloudAway(cloud));meadow.append(cloud);const note=document.createElement('span');note.className='cloud-note';note.textContent='点我飘走';note.style.left=x+'%';note.style.top=(y+10)+'%';note.id='cloud-note-'+cloudId;meadow.append(note);}
      function sendCloudAway(cloud){if(!cloud.isConnected||cloud.classList.contains('sailing'))return;cloud.classList.add('sailing');const id=cloud.id.replace('cloud-','');const note=document.getElementById('cloud-note-'+id);if(note)note.remove();cloudId=0;cloudCount++;status.textContent='小乌云飘走啦！一颗星星也没有少。';status.className='status neutral';setTimeout(()=>cloud.remove(),1500);if(!gameOver&&cloudCount%3===0)setTimeout(spawnCloud,3500);}
      function start(){round++;count=0;active=[];cloudId=0;nextId=0;gameOver=false;cloudCount=0;document.getElementById('finish').classList.remove('show');meadow.querySelectorAll('.creature,.cloud,.cloud-note').forEach(x=>x.remove());drawProgress();status.textContent='小兔子、小鸡和小猫正在草地上玩耍。';status.className='status neutral';animals.forEach(animal=>spawnAnimal(animal));for(let i=0;i<2;i++)spawnAnimal();}
      document.getElementById('restart').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);start();
    })();
  </script>
</body>
</html>
